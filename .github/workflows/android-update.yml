name: Cập nhật Android (EAS Update)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Kiểm tra tương thích với APK đã phát hành
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./app.json').expo.version")
          tag="v$version"
          if ! git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
            echo "Không có tag $tag: cần build và phát hành APK cho phiên bản này trước."
            exit 1
          fi
          if ! git diff --quiet "$tag" HEAD -- app.json app.config.js app.config.ts eas.json package.json package-lock.json plugins android ios; then
            echo "Cấu hình hoặc dependency native đã thay đổi so với $tag; cần kiểm tra và build APK mới trước khi cập nhật OTA."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Đưa bản cập nhật đến APK Android
        run: eas update --channel production-apk --platform android --environment production --message "GitHub $GITHUB_SHA" --non-interactive
